name: Minecraft Test Server with PingOptimizer

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    name: Run Paper 1.21.1 Server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build PingOptimizer Plugin
        run: |
          mvn clean package -DskipTests

      - name: Setup Minecraft Server Directory & ViaVersion
        run: |
          mkdir -p server/plugins
          cp target/PingOptimizer-1.0.0.jar server/plugins/PingOptimizer.jar
          cd server
          echo "eula=true" > eula.txt
          cat << 'EOF' > server.properties
          server-port=25565
          online-mode=false
          motd=§aPingOptimizer §7Test Server §8(1.21.x / ViaVersion)
          max-players=20
          view-distance=10
          simulation-distance=8
          difficulty=easy
          gamemode=survival
          EOF
          curl -sSL "https://hangarcdn.papermc.io/plugins/ViaVersion/ViaVersion/versions/5.2.1/PAPER/ViaVersion-5.2.1.jar" -o plugins/ViaVersion.jar || true

      - name: Download Paper 1.21.1 Server Jar
        run: |
          cd server
          curl -sSL "https://api.purpurmc.org/v2/purpur/1.21.1/2329/download" -o server.jar

      - name: Start TCP Tunnels (Pinggy & Playit)
        run: |
          # 1. Pinggy TCP Tuneli (Minecraft icin ozel TCP tünel)
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:localhost:25565 tcp@a.pinggy.io > pinggy.log 2>&1 &
          
          # 2. Playit Standalone Agent
          curl -sSL "https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64" -o playit-bin
          chmod +x playit-bin
          ./playit-bin start --secret_path playit_secret.toml > playit.log 2>&1 &

          sleep 8

          echo "=========================================================="
          echo "1. PINGGY DIREKT MINECRAFT TCP IP ADRESI:"
          echo "=========================================================="
          cat pinggy.log || true
          echo ""
          echo "=========================================================="
          echo "2. PLAYIT.GG CLAIM BAGLANTISI:"
          echo "=========================================================="
          cat playit.log || true
          echo "=========================================================="

      - name: Start Minecraft Server
        run: |
          cd server
          echo "Starting Minecraft Server with PingOptimizer..."
          java -Xms4G -Xmx6G -jar server.jar --nogui

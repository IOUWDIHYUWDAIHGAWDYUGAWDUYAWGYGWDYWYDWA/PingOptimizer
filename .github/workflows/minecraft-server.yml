name: Minecraft Test Server with PingOptimizer

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    name: Run Paper 1.21.1 Server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build PingOptimizer Plugin
        run: |
          mvn clean package -DskipTests

      - name: Setup Minecraft Server Directory & ViaVersion
        run: |
          mkdir -p server/plugins
          cp target/PingOptimizer-1.0.0.jar server/plugins/PingOptimizer.jar
          cd server
          echo "eula=true" > eula.txt
          cat << 'EOF' > server.properties
          server-port=25565
          online-mode=false
          motd=§aPingOptimizer §7Test Server §8(1.21.x / ViaVersion)
          max-players=20
          view-distance=10
          simulation-distance=8
          difficulty=easy
          gamemode=survival
          EOF
          curl -sSL "https://hangarcdn.papermc.io/plugins/ViaVersion/ViaVersion/versions/5.2.1/PAPER/ViaVersion-5.2.1.jar" -o plugins/ViaVersion.jar || true

      - name: Download Paper 1.21.1 Server Jar
        run: |
          cd server
          curl -sSL "https://api.purpurmc.org/v2/purpur/1.21.1/2329/download" -o server.jar

      - name: Install & Start Playit.gg Tunnel
        run: |
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/playit.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://playit-cloud.github.io/ppa/data ./" | sudo tee /etc/apt/sources.list.d/playit.list >/dev/null
          sudo apt-get update -y
          sudo apt-get install -y playit
          sudo systemctl restart playit
          sleep 6
          echo "=========================================================="
          echo "PLAYIT.GG BAGLANTI BILGISI:"
          echo "=========================================================="
          sudo journalctl -u playit -n 35 --no-pager || true
          echo "=========================================================="

      - name: Start Pinggy Backup Tunnel (Aninda Direkt IP)
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:localhost:25565 a.pinggy.io > pinggy.log 2>&1 &
          sleep 5
          echo "=========================================================="
          echo "PINGGY DIREKT BAGLANTI ADRESI:"
          echo "=========================================================="
          cat pinggy.log || true
          echo "=========================================================="

      - name: Start Minecraft Server
        run: |
          cd server
          echo "Starting Minecraft Server with PingOptimizer..."
          java -Xms4G -Xmx6G -jar server.jar --nogui
